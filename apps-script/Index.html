<!DOCTYPE html>
<html lang="en">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>SelfMate</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Young+Serif&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  /* SelfMate "Garden" design: calm greens, a plant that grows with your habits.
     Colours are named after the garden; change them here to restyle the whole app. */
  :root {
    --bg: #EDF2E4; --card: #F8FBF3; --ink: #1D3527; --muted: #5E7266; --line: #D5DEC9;
    --leaf: #3F8F4F; --sprout: #9CCB6B; --pollen: #F2C14E; --berry: #B8436B; --sky: #CDE3E8; --soil: #7A5A44;
    --accent: var(--leaf); --accent-soft: #DCEBD3; --good: var(--leaf); --good-soft: #DCEBD3;
    --warn: #8A6410; --warn-soft: #FBEBC0; --bad: var(--berry); --bad-soft: #F8D7E1;
    --b1: #9CCB6B; --b2: #F2C14E; --b3: #CDE3E8; --b4: #F3C4D3; --b5: #CFE6B8; --b6: #E9D3BD; --b7: #D9D2F0;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #14211A; --card: #1C2C22; --ink: #E7F0E1; --muted: #9DB2A3; --line: #2C4033;
      --leaf: #7CC487; --sprout: #B6DE8A; --sky: #24414A; --soil: #B08A6E; --berry: #E77FA3;
      --accent-soft: #24402C; --good-soft: #24402C; --warn: #F5DD9A; --warn-soft: #4A3D1E; --bad-soft: #4A2533;
      --b1: #4F7F3E; --b2: #7A6324; --b3: #2F5361; --b4: #6B3348; --b5: #3D5A2E; --b6: #5E4835; --b7: #46406B;
    }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 15.5px/1.5 "Instrument Sans", system-ui, sans-serif; }
  :focus-visible { outline: 3px solid var(--pollen); outline-offset: 2px; }
  .serif, .big, h1, .brand { font-family: "Young Serif", Georgia, serif; font-weight: 400; }
  header.top { position: sticky; top: 0; z-index: 5; display: flex; align-items: center; justify-content: space-between;
    padding: 12px 18px; background: var(--bg); }
  .brand { font-size: 21px; letter-spacing: -.2px; }
  main { padding: 0 18px 110px; max-width: 640px; margin: 0 auto; }
  h1 { font-size: 29px; line-height: 1.15; margin: 2px 0 0; letter-spacing: -.3px; }
  h2 { font-family: "Young Serif", Georgia, serif; font-weight: 400; font-size: 20px; color: var(--ink); margin: 30px 0 10px; }
  .card { background: var(--card); border: 1px solid var(--line); border-radius: 24px 6px 24px 6px; padding: 14px 16px; margin-bottom: 10px; }
  .hero { display: flex; gap: 14px; align-items: center; }
  .big { font-size: 30px; letter-spacing: -.5px; line-height: 1.1; }
  .label { font-size: 13.5px; color: var(--muted); }
  .muted { color: var(--muted); } .small { font-size: 13px; }
  .row { display: flex; align-items: center; gap: 10px; background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 11px 12px; margin-bottom: 8px; cursor: pointer; }
  .grow { flex: 1; min-width: 0; } .grow > div:first-child { overflow: hidden; text-overflow: ellipsis; }
  .emo { font-size: 22px; width: 30px; text-align: center; }
  .pill { font-size: 12px; font-weight: 600; padding: 3px 9px; border-radius: 99px; white-space: nowrap; }
  .p-bad { background: var(--bad-soft); color: var(--bad); } .p-warn { background: var(--warn-soft); color: var(--warn); }
  .p-ok { background: var(--line); color: var(--muted); } .p-good { background: var(--good-soft); color: var(--good); }
  button { font: inherit; border: 0; cursor: pointer; color: inherit; background: none; }
  .btn { background: var(--leaf); color: #fff; border-radius: 22px 5px 22px 5px; padding: 12px 16px; font-weight: 600; }
  .btn.ghost { background: var(--accent-soft); color: var(--leaf); }
  @media (prefers-color-scheme: dark) { .btn { color: #14211A; } .btn.ghost { color: var(--leaf); } }
  .btn.wide { width: 100%; } .btns { display: flex; gap: 8px; margin: 10px 0; } .btns .btn { flex: 1; }
  .done { width: 36px; height: 36px; border-radius: 50% 50% 50% 6px; background: var(--good-soft); color: var(--leaf); font-weight: 700; flex: none; }
  .alert { display: block; width: 100%; text-align: left; background: var(--warn-soft); color: var(--warn); font-weight: 600;
    border-radius: 6px 24px 6px 24px; padding: 13px 16px; margin: 12px 0; }
  .alert.soft { background: var(--accent-soft); color: var(--leaf); }
  .bar { height: 10px; background: var(--line); border-radius: 99px; overflow: hidden; }
  .bar i { display: block; height: 100%; border-radius: 99px; background: var(--leaf); }
  .barrow { margin: 10px 0; } .barrow .top { display: flex; justify-content: space-between; gap: 8px; font-size: 14px; margin-bottom: 5px; }
  .ring { width: 84px; height: 84px; flex: none; }
  .ring .track { fill: none; stroke: var(--line); stroke-width: 9; }
  .ring .fill { fill: none; stroke-width: 9; stroke-linecap: round; transition: stroke-dasharray .6s; }
  .ring text { font-family: "Young Serif", serif; font-size: 17px; fill: var(--ink); }
  .cols { display: flex; align-items: flex-end; gap: 6px; height: 120px; padding-top: 8px; }
  .cols div { flex: 1; min-width: 0; text-align: center; font-size: 11px; color: var(--muted); }
  .cols div { overflow-wrap: normal; white-space: nowrap; }
  .cols.dense { gap: 2px; } .cols.dense div { font-size: 10px; overflow: visible; } .cols.dense b { border-radius: 4px 4px 1px 1px; }
  /* never let long words or wide content push a page sideways */
  .card, .row, .ticket, .packet, .blk, .alert, p, h1, h2, h3 { overflow-wrap: anywhere; }
  svg, img { max-width: 100%; }
  .cols b { display: block; background: var(--sprout); border-radius: 10px 10px 2px 2px; margin-bottom: 4px; min-height: 2px; }
  .cols div:last-child b { background: var(--leaf); }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; margin: 8px 0; }
  .chip { background: var(--card); border: 1px solid var(--line); border-radius: 99px; padding: 6px 12px; font-size: 14px; max-width: 100%; overflow-wrap: anywhere; text-align: left; }
  .chip.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .tiles { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
  .tile { background: var(--card); border: 1px solid var(--line); border-radius: 16px; padding: 10px; }
  .tile b { display: block; font-family: "Young Serif", serif; font-weight: 400; font-size: 19px; } .tile span { font-size: 12px; color: var(--muted); }
  .check { width: 26px; height: 26px; border-radius: 50% 50% 50% 6px; border: 2px solid var(--line); flex: none; display: grid; place-items: center; font-size: 14px; }
  .check.on { background: var(--leaf); border-color: var(--leaf); color: #fff; }
  .check.half { border-color: var(--pollen); color: var(--warn); }
  .strike { text-decoration: line-through; color: var(--muted); }
  .next { border: 2px solid var(--leaf); }

  /* Today: the plant */
  .garden { position: relative; margin: 14px -18px 0; height: 270px; overflow: hidden; transition: background 1s; }
  .garden svg.scene { position: absolute; inset: 0; width: 100%; height: 100%; }
  .stem { stroke: var(--leaf); stroke-width: 6; stroke-linecap: round; fill: none; }
  .leafs path { fill: var(--sprout); stroke: var(--leaf); stroke-width: 2; transform-box: fill-box; transform-origin: 0% 100%; }
  .leafs path.new { animation: growleaf .9s cubic-bezier(.2,.9,.3,1.3) both; }
  @keyframes growleaf { from { transform: scale(0) rotate(-20deg); } }
  /* the temperature is part of the picture: serif like the headings, no box, fades in */
  .wx { position: absolute; left: 18px; top: 16px; display: flex; align-items: center; gap: 10px; color: var(--ink); animation: wxin 1.2s ease-out both; }
  .wx.light { color: #EEF3E8; }
  .wx .deg { font-family: "Young Serif", Georgia, serif; font-size: 40px; line-height: 1; letter-spacing: -1px; }
  .wx .what { font-size: 13.5px; line-height: 1.25; opacity: .85; }
  @keyframes wxin { from { opacity: 0; transform: translateY(-6px); } }
  .drop { animation: fall 1s linear infinite; } .flake { animation: snowfall 4s linear infinite; }
  @keyframes fall { 0% { transform: translateY(0); opacity: 0; } 10% { opacity: .9; } 85% { opacity: .9; } 100% { transform: translateY(175px); opacity: 0; } }
  @keyframes snowfall { 0% { transform: translate(0, 0); opacity: 0; } 10% { opacity: 1; } 50% { transform: translate(8px, 90px); } 100% { transform: translate(-4px, 180px); opacity: 0; } }
  .drift { animation: drift 13s ease-in-out infinite alternate; }
  @keyframes drift { from { transform: translateX(-10px); } to { transform: translateX(12px); } }
  @media (prefers-reduced-motion: reduce) { .wx { animation: none; } }
  .flash { animation: flash 5s infinite; } @keyframes flash { 0%, 92%, 100% { opacity: 0; } 94%, 97% { opacity: 1; } }
  @media (prefers-reduced-motion: reduce) { .leafs path.new, .drop, .flake, .drift, .flash { animation: none; } }
  .habit { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-top: 12px; }
  .habit p { margin: 0; color: var(--muted); font-size: 14px; flex: 1; }
  .habit .btn { white-space: nowrap; flex: none; }
  .spend { font-family: "Young Serif", serif; font-size: 24px; line-height: 1.3; margin: 26px 0 0; }
  .spend b { font-weight: 400; font-size: 44px; display: block; letter-spacing: -1px; line-height: 1.05; }
  .meter { height: 12px; border-radius: 12px; background: var(--line); margin: 12px 0 6px; overflow: hidden; }
  .meter i { display: block; height: 100%; background: var(--leaf); border-radius: 12px; }
  .meter.low i { background: var(--pollen); } .meter.out i { background: var(--berry); }

  /* Dates as tickets (borrowed from Bento) */
  .ticket { display: grid; grid-template-columns: 74px 1fr auto; align-items: stretch; background: var(--card); border: 1px solid var(--line);
    border-radius: 18px; margin-bottom: 9px; overflow: hidden; cursor: pointer; }
  .ticket .d { display: grid; place-items: center; text-align: center; border-right: 2px dashed var(--line); padding: 8px 4px; }
  .ticket .d b { font-family: "Young Serif", serif; font-weight: 400; font-size: 26px; line-height: 1; display: block; }
  .ticket .d span { font-size: 11.5px; font-weight: 600; }
  .ticket .d.soon { background: var(--bad-soft); color: var(--bad); } .ticket .d.near { background: var(--warn-soft); color: var(--warn); }
  .ticket .d.later { color: var(--muted); } .ticket .d.none { background: var(--accent-soft); color: var(--leaf); }
  .ticket .t { padding: 11px 12px; min-width: 0; }
  .ticket .t b { font-weight: 600; display: block; overflow: hidden; text-overflow: ellipsis; }
  .ticket .t div { font-size: 13px; color: var(--muted); }
  .ticket .act { display: grid; place-items: center; padding-right: 10px; }

  /* Money: colour blocks sized by spending (borrowed from Bento) */
  .blocks { display: flex; flex-wrap: wrap; gap: 7px; }
  .blk { border-radius: 18px 5px 18px 5px; padding: 10px 11px; min-height: 74px; color: var(--ink); display: flex; flex-direction: column;
    justify-content: space-between; text-align: left; min-width: 0; }
  .blk span { font-size: 13px; font-weight: 600; overflow: hidden; text-overflow: ellipsis; }
  .blk b { font-family: "Young Serif", serif; font-weight: 400; font-size: 21px; line-height: 1.1; }
  .blk small { font-size: 11.5px; color: var(--muted); }
  .blk.over { box-shadow: inset 0 0 0 2px var(--berry); }

  /* Trips as seed packets */
  .packet { display: grid; grid-template-columns: 96px 1fr auto; background: var(--card); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; margin-bottom: 10px; cursor: pointer; }
  .packet .art { display: grid; place-items: center; font-size: 44px; background: var(--sky); border-right: 2px dashed var(--line); }
  .packet:nth-of-type(3n+2) .art { background: var(--warn-soft); } .packet:nth-of-type(3n) .art { background: var(--b7); }
  .packet .info { padding: 11px 12px; min-width: 0; }
  .packet .info b { font-family: "Young Serif", serif; font-weight: 400; font-size: 18px; display: block; }
  .packet .info div { font-size: 13px; color: var(--muted); }
  .packet .seeds { display: flex; gap: 3px; margin-top: 7px; }
  .packet .seeds i { flex: 1; height: 6px; border-radius: 6px; background: var(--line); }
  .packet .seeds i.on { background: var(--leaf); }
  .packet .when { padding: 11px 12px 0 0; }

  nav#tabs { position: fixed; left: 50%; bottom: calc(12px + env(safe-area-inset-bottom)); transform: translateX(-50%); display: flex; gap: 2px;
    background: var(--ink); padding: 5px; border-radius: 28px; box-shadow: 0 8px 24px rgba(29,53,39,.25); z-index: 6; width: min(calc(100% - 16px), 470px); }
  nav#tabs button { flex: 1 1 0; min-width: 0; display: flex; flex-direction: column; align-items: center; gap: 1px; color: var(--bg); padding: 6px 2px 5px; border-radius: 22px;
    font-size: 10.5px; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  nav#tabs button .i { font-size: 18px; line-height: 1.15; }
  nav#tabs button.on { background: var(--sprout); color: #1D3527; }
  .modal { position: fixed; inset: 0; background: rgba(20,33,26,.45); display: flex; align-items: flex-end; z-index: 10; }
  .modal.hidden { display: none; }
  .sheet { background: var(--bg); width: 100%; max-width: 640px; margin: 0 auto; border-radius: 26px 26px 0 0; padding: 20px 18px 30px;
    max-height: 88vh; overflow: auto; }
  .sheet h3 { font-family: "Young Serif", serif; font-weight: 400; font-size: 22px; margin: 0 0 12px; }
  label { display: block; font-size: 13.5px; color: var(--muted); margin: 10px 0 4px; }
  input, select, textarea { width: 100%; font: inherit; padding: 11px 12px; border-radius: 14px; border: 1px solid var(--line);
    background: var(--card); color: var(--ink); }
  input.amount { font-family: "Young Serif", serif; font-size: 32px; text-align: center; }
  #toast { position: fixed; left: 50%; bottom: 92px; transform: translateX(-50%); background: var(--ink); color: var(--bg);
    padding: 10px 16px; border-radius: 99px; font-weight: 600; opacity: 0; transition: opacity .25s; pointer-events: none; z-index: 20; }
  #toast.show { opacity: 1; }
  .banner { background: var(--warn-soft); color: var(--warn); text-align: center; font-size: 13px; padding: 6px; font-weight: 600; }
  .seg { display: flex; background: var(--line); border-radius: 16px; padding: 3px; margin: 10px 0; }
  .seg button { flex: 1; padding: 7px 0; border-radius: 13px; font-size: 13.5px; font-weight: 600; color: var(--muted); }
  .seg button.on { background: var(--card); color: var(--ink); }
  .back { color: var(--leaf); font-weight: 600; padding: 6px 0; }
  .loading { text-align: center; padding: 60px 0; color: var(--muted); font-family: "Young Serif", serif; font-size: 18px; }
  .askbar { display: block; width: 100%; text-align: left; margin-top: 16px; padding: 13px 16px; border-radius: 99px; background: var(--card); border: 1px solid var(--line); color: var(--muted); }
  .inline { display: flex; gap: 6px; margin: 8px 0; } .inline input { flex: 1; } .inline .btn { padding: 0 14px; }
</style>
</head>
<body>
<header class="top">
  <div class="brand">🌱 SelfMate</div>
  <button id="gear" onclick="openSettings()" style="font-size:22px" aria-label="Settings">⚙️</button>
</header>
<div id="banner"></div>
<main id="view"><div class="loading">Watering the garden…</div></main>
<nav id="tabs"></nav>
<div id="modal" class="modal hidden" onclick="if(event.target===this)closeModal()"><div class="sheet" id="sheet"></div></div>
<div id="toast"></div>

<script>
const KEY = "<?= key ?>";
const AREA = { Car: '🚗', Home: '🏠', Taxes: '🧾', Health: '🩺', Documents: '🪪', Insurance: '🛡️', Digital: '🌐',
               People: '🎂', SRL: '🏢', Subscriptions: '📺', Other: '📌' };
const TABS = [['home', '🌱', 'Today'], ['money', '💰', 'Money'], ['dates', '📅', 'Dates'], ['trips', '✈️', 'Trips'],
              ['projects', '🛠️', 'Projects', true], ['srl', '🏢', 'SRL', true]];
const GROUP_COLORS = ['var(--leaf)', 'var(--pollen)', '#6FA3B5', 'var(--berry)', '#8C7AC9', 'var(--soil)', 'var(--muted)'];
const BLOCKS = ['var(--b1)', 'var(--b2)', 'var(--b3)', 'var(--b4)', 'var(--b5)', 'var(--b6)', 'var(--b7)'];
let D = null, TAB = 'home', SUB = null, SEG = {};

// ---------- small helpers ----------
const $ = s => document.querySelector(s);
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const lei = n => Math.round(n || 0).toLocaleString('ro-RO') + ' lei';
const todayISO = () => { const d = new Date(); d.setMinutes(d.getMinutes() - d.getTimezoneOffset()); return d.toISOString().slice(0, 10); };
const days = iso => Math.round((new Date(iso + 'T00:00:00') - new Date(todayISO() + 'T00:00:00')) / 864e5);
const fmt = iso => iso ? new Date(iso + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short', year: 'numeric' }) : '';
const isDone = d => d.LastDone && d.Due && d.LastDone >= d.Due && !(+d.RepeatMonths > 0);
const sum = (a, f) => a.reduce((s, x) => s + (+f(x) || 0), 0);
const yes = v => v === true || String(v).toLowerCase() === 'yes';
const catOf = name => D.categories.find(c => c.Category === name) || { Type: 'flex', Emoji: '•', Group: 'Other' };
const ron = t => !t.Currency || t.Currency === 'RON';
const rep = n => ({ 1: 'month', 3: '3 months', 6: '6 months', 12: 'year', 24: '2 years' }[n] || n + ' months');

// ---------- PIN session (remembered on this phone only) ----------
const SKEY = 'selfmate_session_' + KEY.slice(0, 8);
let SESSION = (() => { try { return localStorage.getItem(SKEY) || ''; } catch (e) { return ''; } })();
function saveSession(t) {
  SESSION = t || '';
  try { t ? localStorage.setItem(SKEY, t) : localStorage.removeItem(SKEY); } catch (e) { /* storage blocked: PIN asked each time */ }
}

function call(action, data) {
  const payload = Object.assign({}, data || {}, { _s: SESSION });
  return new Promise((res, rej) => {
    if (window.google && google.script && google.script.run) {
      google.script.run.withSuccessHandler(res).withFailureHandler(e => {
        if (/LOCKED/.test(e.message)) { saveSession(''); lockScreen({ hasPin: true, role: D && D.role }); }
        else toast('⚠️ ' + e.message);
        rej(e);
      }).api(KEY, action, payload);
    } else setTimeout(() => { try { res(MOCK.api(action, payload)); } catch (e) { rej(e); } }, 150);
  });
}
async function load() {
  if (!D) {
    const st = await call('pinStatus');
    if (!st.valid) return lockScreen(st);
  }
  D = await call('getData');
  render();
  if (!WX) loadWeather();
}
function lockScreen(st) {
  D = null; closeModal();
  $('#tabs').innerHTML = ''; $('#banner').innerHTML = '';
  const pinInput = (id, ph) => `<input id="${id}" type="password" inputmode="numeric" pattern="[0-9]*" maxlength="8" placeholder="${ph}"
    class="amount" style="letter-spacing:8px" onkeydown="if(event.key==='Enter')$('#pinGo').click()">`;
  let body;
  if (!st.hasPin && st.role === 'owner') {
    body = `<h3>🔐 Create your PIN</h3><p class="muted small">4 to 8 digits. You'll need it together with your private link.
      After 5 wrong tries SelfMate locks for 15 minutes.</p>
      ${pinInput('p1', 'PIN')}<div style="height:8px"></div>${pinInput('p2', 'Repeat PIN')}
      <div class="btns"><button id="pinGo" class="btn" onclick="createPin()">Create PIN</button></div>`;
  } else if (!st.hasPin) {
    body = `<h3>🔐 Almost there</h3><p class="muted">Ask the owner to set your PIN in SelfMate ⚙️, then reopen this link.</p>`;
  } else {
    body = `<h3>🔐 Enter your PIN</h3>${pinInput('p1', '••••')}
      <label style="margin-top:12px"><input id="rem" type="checkbox" style="width:auto" checked> Remember this phone for 30 days</label>
      <div class="btns"><button id="pinGo" class="btn" onclick="unlock()">Unlock</button></div>`;
  }
  $('#view').innerHTML = `<div class="card" style="margin-top:40px">${body}</div>`;
  setTimeout(() => { const e = $('#p1'); if (e) e.focus(); }, 50);
}
async function unlock() {
  const t = await call('login', { pin: val('p1'), remember: $('#rem').checked }).catch(() => null);
  if (t) { saveSession(t); load(); } else { $('#p1').value = ''; }
}
async function createPin() {
  if (val('p1') !== val('p2')) return toast('The two PINs are different');
  const t = await call('createPin', { pin: val('p1') }).catch(() => null);
  if (t) { saveSession(t); toast('PIN created 🔐'); load(); }
}
async function lockNow() {
  await call('logout');
  saveSession('');
  lockScreen({ hasPin: true, role: D && D.role });
}
async function act(action, data, msg) { closeModal(); await call(action, data); if (msg) toast(msg); await load(); }
const add = (tab, values, msg) => act('addRow', { tab, values }, msg || 'Saved ✓');
const upd = (tab, row, values, msg) => act('updateRow', { tab, row, values }, msg);
function toast(m) { const t = $('#toast'); t.textContent = m; t.classList.add('show'); setTimeout(() => t.classList.remove('show'), 2200); }
// ---------- back button: every screen and panel is a step in the phone's history ----------
const HIST = window.google && google.script && google.script.history ? google.script.history : null;
let modalOpen = false, skipNextBack = false;
function pushStep(state) { if (HIST) HIST.push(state); else history.pushState(state, ''); }
function onBack(state) {
  if (skipNextBack) { skipNextBack = false; return; }
  if (modalOpen) { modalOpen = false; $('#modal').classList.add('hidden'); return; }   // back closes an open panel first
  state = state || {};

// ---------- money maths ----------
function yearlyPot() { // monthly amount to put aside for everything that isn't paid monthly
  return sum(D.dates.filter(d => d.Private !== 'yes' && +d.RepeatMonths >= 2 && +d.Cost > 0), d => d.Cost / d.RepeatMonths);
}
function safeToSpend() {
  const s = D.settings, income = +s.MonthlyIncome || 0;
  if (!income) return { ready: false };
  const fixed = sum(D.categories.filter(c => c.Type === 'fixed'), c => c.MonthlyTarget);
  const flexMonth = income - fixed - (+s.MonthlySavings || 0) - yearlyPot();
  const weekly = flexMonth * 7 / 30.4;
  const now = new Date(todayISO() + 'T00:00:00'); now.setDate(now.getDate() - ((now.getDay() + 6) % 7));
  const monday = new Date(now.getTime() - now.getTimezoneOffset() * 6e4).toISOString().slice(0, 10);
  // Up card groceries are paid with meal vouchers, not with money from the salary
  const spent = -sum(D.transactions.filter(t => ron(t) && t.Date >= monday && +t.Amount < 0 && catOf(t.Category).Type === 'flex' && t.Account !== 'Up card'), t => t.Amount);
  return { ready: true, weekly, spent, left: weekly - spent, pct: weekly > 0 ? (weekly - spent) / weekly : 0, fixed, flexMonth };
}
const spendTx = t => ron(t) && +t.Amount < 0 && ['flex', 'fixed', 'pot'].includes(catOf(t.Category).Type);
const monthKey = back => { const d = new Date(); d.setDate(1); d.setMonth(d.getMonth() - (back || 0)); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
function catSpend(month) { // { category: lei spent } for one month
  const o = {};
  D.transactions.filter(t => spendTx(t) && String(t.Date).startsWith(month)).forEach(t => o[t.Category] = (o[t.Category] || 0) - t.Amount);
  return o;
}
const prevMonth = m => { const d = new Date(m + '-01T00:00:00'); d.setMonth(d.getMonth() - 1); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0'); };
const monthName = (m, opt) => new Date(m + '-01T00:00:00').toLocaleDateString('en-GB', opt || { month: 'short' });
function catRows(limit, month) {
  month = month || monthKey(0);
  const now = catSpend(month), prev = catSpend(prevMonth(month));
  const rows = Object.keys(now).map(c => ({ c, v: now[c], p: prev[c] || 0, t: +catOf(c).MonthlyTarget || 0 })).sort((a, b) => b.v - a.v);
  if (!rows.length) return '<p class="muted">No spending recorded for this month yet. Import a statement or quick-add.</p>';
  const max = rows[0].v;
  return rows.slice(0, limit || rows.length).map(r => {
    const over = r.t && r.v > r.t, pct = r.t ? r.v / r.t * 100 : r.v / max * 100;
    const diff = r.p ? Math.round((r.v - r.p) / r.p * 100) : null;
    return `<div class="barrow" onclick="catModal('${esc(r.c).replace(/'/g, "\\'")}')" style="cursor:pointer"><div class="top">
      <span>${catOf(r.c).Emoji} ${esc(r.c)}</span><span><b>${lei(r.v)}</b>${r.t ? `<span class="muted"> / ${lei(r.t)}</span>` : ''}</span></div>
      ${bar(pct, over ? 'var(--bad)' : r.t ? 'var(--good)' : 'var(--accent)')}
      ${diff !== null ? `<div class="small muted" style="margin-top:2px">${diff > 0 ? '▲' : '▼'} ${Math.abs(diff)}% vs last month (${lei(r.p)})</div>` : ''}</div>`;
  }).join('');
}
function catModal(cat) {
  const c = catOf(cat), m = SEG.month || monthKey(0);
  const tx = D.transactions.filter(t => t.Category === cat && String(t.Date).startsWith(m)).sort((a, b) => a.Date < b.Date ? 1 : -1);
  const hist = [];
  for (let i = 0, k = m; i < 6; i++, k = prevMonth(k)) hist.unshift({ m: k, v: catSpend(k)[cat] || 0 });
  const hmax = Math.max(1, ...hist.map(h => h.v));

    <div class="card"><div class="cols">${hist.map(h => `<div><b style="height:${h.v / hmax * 90}px"></b>
      ${new Date(h.m + '-01T00:00:00').toLocaleDateString('en-GB', { month: 'short' })}<br>${h.v ? Math.round(h.v) : ''}</div>`).join('')}</div></div>
    ${c._row ? `<label>Monthly guide amount (lei, optional, 0 = none)</label>

// ---------- TODAY: the garden ----------
function greet() { const h = new Date().getHours(); return h < 5 ? 'Good night' : h < 12 ? 'Good morning' : h < 18 ? 'Good afternoon' : 'Good evening'; }

// Sky colour follows the season and the time of day.
function sky() {
  const d = new Date(), m = d.getMonth(), h = d.getHours();
  const season = m <= 1 || m === 11 ? 'winter' : m <= 4 ? 'spring' : m <= 7 ? 'summer' : 'autumn';
  // rough sunrise / sunset hours in Cluj per month (local time)
  const rise = [8, 7, 7, 6, 6, 5, 6, 6, 7, 7, 7, 8][m], set = [17, 18, 19, 20, 21, 21, 21, 20, 19, 18, 17, 16][m];
  const night = h < rise || h > set, dusk = !night && (h === rise || h === set);
  const dark = window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
  let top = { winter: '#D7E3EC', spring: '#CFE8D6', summer: '#BCDDF1', autumn: '#ECD8BC' }[season];
  if (dusk) top = '#F1C9A5';
  if (night) top = '#24304A';
  if (dark) top = night ? '#121C30' : '#22384A';
  return { season, night, bg: `linear-gradient(${top}, var(--bg))` };
}

// Live weather in Cluj-Napoca from Open-Meteo (free, no account). Cached for 30 minutes on this phone.
let WX = null;
function weatherKind(c) {
  return c === 0 ? 'clear' : c <= 2 ? 'partly' : c === 3 ? 'cloudy' : c <= 48 ? 'fog' : (c >= 71 && c <= 77) || c === 85 || c === 86 ? 'snow' : c >= 95 ? 'storm' : 'rain';
}
const WX_LABEL = { clear: 'clear sky', partly: 'some clouds', cloudy: 'cloudy', fog: 'foggy', rain: 'rain', snow: 'snow', storm: 'thunderstorm' };
async function loadWeather() {
  try {
    const c = JSON.parse(sessionStorage.getItem('sm_wx') || 'null');
    if (c && c.city === city() && Date.now() - c.t < 30 * 6e4) { WX = c.w; return paintGarden(); }
  } catch (e) { /* no storage: just fetch */ }
  try {
    const r = await fetch(`https://api.open-meteo.com/v1/forecast?latitude=${CITIES[city()][0]}&longitude=${CITIES[city()][1]}&current=temperature_2m,weather_code,is_day&timezone=Europe%2FBucharest`);
    const j = await r.json();
    WX = { kind: weatherKind(j.current.weather_code), temp: Math.round(j.current.temperature_2m) };
    try { sessionStorage.setItem('sm_wx', JSON.stringify({ t: Date.now(), w: WX, city: city() })); } catch (e) { /* fine */ }
    paintGarden();
  } catch (e) { /* offline or blocked: the plant shows without weather */ }
}
function paintGarden(fresh) {
  const g = document.getElementById('garden');
  if (g) g.innerHTML = scene(+D.settings.Checkins || 0, fresh);
}

function scene(n, fresh) {
  const sk = sky(), L = Math.min(n, 12), flowers = n > 12 ? Math.min(5, Math.floor((n - 12) / 3) + 1) : 0;
  const h = n === 0 ? 16 : 26 + L * 13, top = 220 - h, w = WX && WX.kind;
  const rnd = i => { const x = Math.sin(i * 12.9898 + 4.1) * 43758.5453; return x - Math.floor(x); }; // evenly spread "random"
  // weather layer
  let wx = '';
  const sunOrMoon = sk.night
    ? `<path d="M338 34 a20 20 0 1 0 14 34 a16 16 0 1 1 -14 -34z" fill="#F6E7A8"/>`
    : `<g><circle cx="335" cy="50" r="20" fill="var(--pollen)"/>${[0, 45, 90, 135, 180, 225, 270, 315].map(a => `<line x1="335" y1="50" x2="${335 + 32 * Math.cos(a * Math.PI / 180)}" y2="${50 + 32 * Math.sin(a * Math.PI / 180)}" stroke="var(--pollen)" stroke-width="3" stroke-linecap="round" opacity=".7"/>`).join('')}<circle cx="335" cy="50" r="20" fill="var(--pollen)"/></g>`;
  // puffy cloud with a rounded bottom; position lives on the outer group so the drift animation can't move it off-screen
  const cloud = (x, y, s, col, k) => `<g transform="translate(${x} ${y}) scale(${s})"><g class="drift" style="animation-duration:${11 + k * 4}s;animation-delay:-${k * 3}s">
    <circle cx="22" cy="30" r="14" fill="${col}"/><circle cx="44" cy="20" r="20" fill="${col}"/><circle cx="68" cy="29" r="15" fill="${col}"/>
    <rect x="8" y="28" width="76" height="17" rx="8.5" fill="${col}"/></g></g>`;
  const cloudsAt = col => cloud(150, 26, 1.15, col, 0) + cloud(262, 44, .95, col, 1);   // right side: the temperature sits top-left
  if (!w || w === 'clear') wx += sunOrMoon;
  if (w === 'partly') wx += sunOrMoon + cloud(240, 48, .9, 'rgba(255,255,255,.92)', 0);
  if (w === 'cloudy' || w === 'fog') wx += cloudsAt(sk.night ? 'rgba(200,210,220,.85)' : 'rgba(255,255,255,.92)');
  if (w === 'fog') wx += [120, 150, 180].map((y, i) => `<rect x="${-20 + i * 30}" y="${y}" width="440" height="12" rx="6" fill="rgba(255,255,255,.4)"/>`).join('');
  if (w === 'rain' || w === 'storm' || w === 'snow') {
    const col = w === 'storm' ? '#7D8794' : w === 'snow' ? 'rgba(240,244,248,.95)' : sk.night ? '#9AA8B6' : '#B9C3CC';
    wx += cloudsAt(col);
    for (let i = 0; i < 26; i++) {
      // drops start under the clouds, spread across the sky, each with its own speed and start time
      const x = 150 + rnd(i) * 230, y = 70 + rnd(i + 50) * 10, dur = (.8 + rnd(i + 100) * .6).toFixed(2), delay = (rnd(i + 150) * 2).toFixed(2);
      wx += w === 'snow'
        ? `<g transform="translate(${x - 90} ${y})"><circle class="flake" style="animation-duration:${(dur * 4).toFixed(1)}s;animation-delay:-${delay * 2}s" r="${2 + rnd(i + 9) * 1.5}" fill="#fff"/></g>`
        : `<g transform="translate(${x - 60} ${y})"><path class="drop" style="animation-duration:${dur}s;animation-delay:-${delay}s" d="M0 0 C1.8 3.5 3 5.5 0 8.5 C-3 5.5 -1.8 3.5 0 0Z" fill="#7FA9CF"/></g>`;
    }
    if (w === 'storm') wx += `<path class="flash" d="M250 70 l-14 34 h12 l-10 30 l26 -40 h-13 l11 -24z" fill="var(--pollen)"/>`;
  }
  // season details on the ground
  const ground = {
    autumn: `<path d="M70 252 q8 -8 16 0 q-8 6 -16 0z" fill="#D9822B"/><path d="M300 256 q8 -8 16 0 q-8 6 -16 0z" fill="#C9542E"/><path d="M330 250 q7 -7 14 0 q-7 5 -14 0z" fill="#E0A93A"/>`,
    winter: `<ellipse cx="200" cy="262" rx="190" ry="9" fill="#FFFFFF" opacity=".8"/>`,
    spring: `${[[80, 252], [110, 256], [300, 254], [325, 250]].map(([x, y]) => `<circle cx="${x}" cy="${y}" r="4" fill="var(--berry)"/><circle cx="${x}" cy="${y}" r="1.6" fill="var(--pollen)"/>`).join('')}`,
    summer: `${[70, 96, 304, 330].map(x => `<path d="M${x} 258 l4 -12 l4 12" fill="none" stroke="var(--leaf)" stroke-width="2"/>`).join('')}`,
  }[sk.season];
  let leaves = '';
  for (let i = 0; i < L; i++) {
    const y = 212 - 13 * (i + 1), right = i % 2 === 0;
    const d = right ? `M200 ${y} q34 -26 60 -6 q-28 24 -60 6z` : `M200 ${y} q-34 -26 -60 -6 q28 24 60 6z`;
    leaves += `<path class="${fresh && i === L - 1 ? 'new' : ''}" d="${d}"/>`;
  }
  if (n === 0) leaves = `<path d="M200 206 q-14 -12 -24 -2 q12 10 24 2z"/><path d="M200 206 q14 -12 24 -2 q-12 10 -24 2z"/>`;
  let crown = `<circle cx="200" cy="${top - 4}" r="8" fill="var(--pollen)"/>`;
  if (flowers) crown = Array.from({ length: flowers }, (_, i) => { const x = 200 + (i - (flowers - 1) / 2) * 26, y = top - 6 - (i % 2) * 10;
    return [0, 72, 144, 216, 288].map(a => `<circle cx="${x + 8 * Math.cos(a * Math.PI / 180)}" cy="${y + 8 * Math.sin(a * Math.PI / 180)}" r="6" fill="var(--b4)"/>`).join('') + `<circle cx="${x}" cy="${y}" r="5" fill="var(--pollen)"/>`; }).join('');
  if (n === 0) crown = '';
  setTimeout(() => { const g = document.getElementById('garden'); if (g) g.style.background = sk.bg; });
  return `<svg class="scene" viewBox="0 0 400 270" preserveAspectRatio="xMidYMax meet" role="img"
      aria-label="Your plant has ${n} leaves${w ? '. ' + city() + ': ' + WX_LABEL[w] + ', ' + WX.temp + ' degrees' : ''}">
    ${wx}<ellipse cx="200" cy="262" rx="150" ry="9" fill="var(--line)"/>${ground}
    <path d="M158 226 h84 l-10 40 h-64z" fill="var(--soil)"/><rect x="150" y="218" width="100" height="14" rx="4" fill="var(--soil)"/>
    <path class="stem" d="M200 220 C200 ${220 - h / 2} 196 ${top + 18} 200 ${top}"/><g class="leafs">${leaves}</g>${crown}</svg>
    ${w ? `<div class="wx ${sk.night || (window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches) ? 'light' : ''}">
      <span class="deg">${WX.temp}°</span><span class="what">${WX_LABEL[w][0].toUpperCase() + WX_LABEL[w].slice(1)}<br>in ${esc(city())}</span></div>` : ''}`;
}

// Categories as colour blocks, sized by how much went into each.
function catBlocks(month, limit) {
  const now = catSpend(month), prev = catSpend(prevMonth(month));
  let rows = Object.keys(now).map(c => ({ c, v: now[c], p: prev[c] || 0, t: +catOf(c).MonthlyTarget || 0 })).sort((a, b) => b.v - a.v);
  if (!rows.length) return '<p class="muted">No spending recorded for this month yet. Import a statement or quick-add.</p>';
  if (limit && rows.length > limit) {
    const rest = rows.slice(limit - 1);
    rows = rows.slice(0, limit - 1).concat([{ c: '', v: sum(rest, r => r.v), more: rest.length }]);
  }
  const total = sum(rows, r => r.v);
  return `<div class="blocks">${rows.map((r, i) => {
    // size follows the share; small items never stretch to fill a row, so a big block always means big money
    const share = r.v / total, basis = Math.max(28, Math.min(100, share * 170)), grow = share >= .08 ? r.v : 0;
    if (r.more) return `<button class="blk" style="flex:${grow} 1 ${basis}%;background:var(--line)" onclick="SEG.money='cat';go('money')"><span>${r.more} more</span><b>${lei(r.v)}</b><small>tap to see all</small></button>`;
    const diff = r.p ? Math.round((r.v - r.p) / r.p * 100) : null;
    const note = r.t ? `guide ${lei(r.t)}` : diff !== null ? `${diff > 0 ? '+' : ''}${diff}% vs last month` : '';
    return `<button class="blk ${r.t && r.v > r.t ? 'over' : ''}" style="flex:${grow} 1 ${basis}%;background:${BLOCKS[i % BLOCKS.length]}" onclick="catModal('${esc(r.c).replace(/'/g, "\\'")}')">

// ---------- DATES ----------
// Deadlines as tickets: days left on the left, coloured by how soon.
function dateRow(d) {
  const n = d.Due ? days(d.Due) : null;
  const cls = n === null ? 'none' : n <= 7 ? 'soon' : n <= 30 ? 'near' : 'later';
  const num = n === null ? '+' : n === 0 ? '!' : Math.abs(n) > 99 ? Math.round(Math.abs(n) / 30) : Math.abs(n);
  const unit = n === null ? 'set date' : n === 0 ? 'today' : Math.abs(n) > 99 ? 'months' : n < 0 ? 'days late' : n === 1 ? 'day' : 'days';
  const meta = [d.Due ? fmt(d.Due) : '', +d.Cost ? lei(d.Cost) : '', +d.RepeatMonths ? 'every ' + rep(+d.RepeatMonths) : ''].filter(Boolean).join(', ');
  return `<div class="ticket" onclick="dateModal(${d._row})"><div class="d ${cls}"><div><b>${num}</b><span>${unit}</span></div></div>
    <div class="t"><b>${AREA[d.Area] || '📌'} ${esc(d.Title)}</b><div>${meta || 'Tap to set a date'}</div></div>
    <div class="act">${d.Due && !isDone(d) ? `<button class="done" aria-label="Mark ${esc(d.Title)} done" onclick="event.stopPropagation();doneDate(${d._row})">✓</button>` : ''}</div></div>`;
}
async function doneDate(row) {
  const d = D.dates.find(x => x._row === row);
  await act('markDone', { row }, +d.RepeatMonths ? 'Done ✓ Next one scheduled' : 'Done ✓');
}
function viewDates() {
  const area = SEG.area || 'All';
  const list = D.dates.filter(d => area === 'All' || d.Area === area);
  const open = list.filter(d => d.Due && !isDone(d)).sort((a, b) => a.Due < b.Due ? -1 : 1);
  const areas = ['All'].concat([...new Set(D.dates.map(d => d.Area))]);
  const sec = (title, rows) => rows.length ? `<h2>${title} (${rows.length})</h2>${rows.map(dateRow).join('')}` : '';
  const html = `
    <button class="btn wide" onclick="dateModal()">+ Add a date</button>
    <div class="chips">${areas.map(a => `<button class="chip ${a === area ? 'on' : ''}" onclick="SEG.area='${a}';render()">${AREA[a] || ''} ${a}</button>`).join('')}</div>
    ${sec('⚠️ Overdue', open.filter(d => days(d.Due) < 0))}
    ${sec('Next 30 days', open.filter(d => days(d.Due) >= 0 && days(d.Due) <= 30))}
    ${sec('Later', open.filter(d => days(d.Due) > 30))}
    <div id="need">${sec('📝 Needs a date', list.filter(d => !d.Due))}</div>
    ${sec('✅ Done', list.filter(isDone))}

  if (SUB === 'need') setTimeout(() => { const e = $('#need'); if (e) e.scrollIntoView(); SUB = null; }, 50);

}
function dateModal(row) {

function viewMoney() {
  const uns = D.transactions.filter(t => t.Category === 'Unsorted');
  const month = SEG.month || monthKey(0), year = month.slice(0, 4);
  const thisMonth = D.transactions.filter(t => spendTx(t) && String(t.Date).startsWith(month));
  const groups = {};
  thisMonth.forEach(t => { const g = catOf(t.Category).Group; groups[g] = (groups[g] || 0) - t.Amount; });
  const gs = Object.entries(groups).sort((a, b) => b[1] - a[1]), max = gs.length ? gs[0][1] : 1, total = sum(gs, g => g[1]);
  const months = Array.from({ length: 12 }, (_, i) => year + '-' + String(i + 1).padStart(2, '0'));
  const mt = months.map(m => -sum(D.transactions.filter(t => spendTx(t) && String(t.Date).startsWith(m)), t => t.Amount));
  const mmax = Math.max(1, ...mt);
  const years = [...new Set(D.transactions.map(t => String(t.Date).slice(0, 4)).concat([monthKey(0).slice(0, 4)]))].filter(Boolean).sort();
  const recent = D.transactions.slice().sort((a, b) => a.Date < b.Date ? 1 : -1).slice(0, 20);
  const prevTotal = -sum(D.transactions.filter(t => spendTx(t) && String(t.Date).startsWith(prevMonth(month))), t => t.Amount);
  const diff = total - prevTotal;
  return `
    <div class="label">${monthName(month, { month: 'long', year: 'numeric' })}</div>
    <h1>${lei(total)} spent</h1>
    ${prevTotal ? `<p class="muted" style="margin:4px 0 0">That is ${lei(Math.abs(diff))} ${diff <= 0 ? 'less' : 'more'} than ${monthName(prevMonth(month), { month: 'long' })}.</p>` : ''}

    <button class="alert soft" onclick="insightsModal()">💡 ${insights().length} insights from your last 12 months</button>

    ${uns.length ? `<h2>❓ Help me sort (${uns.length})</h2>${uns.slice(0, 5).map(unsortedCard).join('')}

    <h2>Where it went</h2>
    <div class="seg">${[['cat', 'By category'], ['group', 'By group']].map(x => `<button class="${x[0] === (SEG.money || 'cat') ? 'on' : ''}" onclick="SEG.money='${x[0]}';render()">${x[1]}</button>`).join('')}</div>
    <div>${(SEG.money || 'cat') === 'cat' ? catBlocks(month) + '<p class="muted small">Bigger block, more money. Tap one for its history, transactions and a monthly guide amount.</p>'
      : gs.length ? '<div class="card">' + gs.map((g, i) => `<div class="barrow"><div class="top"><span>${esc(g[0])}</span><b>${lei(g[1])}</b></div>
      ${bar(g[1] / max * 100, GROUP_COLORS[i % GROUP_COLORS.length])}</div>`).join('') + '</div>' : '<p class="muted">No spending yet this month.</p>'}</div>
    <h2>Your ${year}, month by month</h2>
    <div class="chips">${years.map(y => `<button class="chip ${y === year ? 'on' : ''}" onclick="SEG.month='${y === monthKey(0).slice(0, 4) ? monthKey(0) : y + '-12'}';render()">${y}</button>`).join('')}</div>
    <div class="card"><div class="cols">${months.map((m, i) => `<div onclick="SEG.month='${m}';render()" style="cursor:pointer">
      <b style="height:${mt[i] / mmax * 90}px;${m === month ? 'background:var(--leaf)' : ''}"></b>${monthName(m).slice(0, 3)}</div>`).join('')}</div>
      <div class="muted small" style="margin-top:6px">${year} total: <b>${lei(sum(mt, x => x))}</b>, without savings and transfers. Tap a month to see it.</div></div>
    <h2>Your money right now</h2>
    ${balancesCard() || '<button class="btn ghost wide" onclick="balanceModal(0)">+ Add cash or savings</button>'}
    <h2>Yearly bills pot</h2>
    <div class="card"><b>${lei(yearlyPot())} / month</b><div class="muted small">Put this aside automatically on payday (e.g. a Revolut Vault),
      and RCA, ITP, impozite etc. stop being surprises. Calculated from the costs on your Dates.</div></div>
    <h2>Recent</h2>

}

// ---------- TRIPS ----------
function tripStats(t) {
  const it = D.tripitems.filter(i => i.Trip === t.Trip);
  const part = type => { const a = it.filter(i => i.Type === type); return { n: a.length, done: a.filter(i => yes(i.Done)).length }; };
  return { it, todo: part('todo'), pack: part('pack'), book: part('booking'), cost: sum(it, i => i.Cost) };
}
function tripCard(t) {
  const s = tripStats(t), n = t.Start ? days(t.Start) : null;
  const ready = (s.todo.done + s.book.done) / Math.max(1, s.todo.n + s.book.n);
  // a trip is a seed packet: the dashes fill up as things get booked and done
  return `<div class="packet" onclick="go('trips','${esc(t.Trip).replace(/'/g, "\\'")}')"><div class="art">${esc(t.Emoji)}</div>
    <div class="info"><b>${esc(t.Trip)} ${t.Private === 'yes' ? '🔒' : ''}</b>
      <div>${t.Start ? fmt(t.Start) + (t.End ? ' to ' + fmt(t.End) : '') : esc(t.Notes || 'Set dates')}</div>
      <div class="seeds">${Array.from({ length: 8 }, (_, i) => `<i class="${i < Math.round(ready * 8) ? 'on' : ''}"></i>`).join('')}</div>
      <div>${s.todo.done}/${s.todo.n} to-dos, ${s.book.done}/${s.book.n} booked, ${s.pack.done}/${s.pack.n} packed${+t.Budget ? `, ${lei(s.cost)} of ${lei(t.Budget)}` : ''}</div></div>
    <div class="when">${n !== null ? (n >= 0 ? `<span class="pill p-good">in ${n}d</span>` : `<span class="pill p-ok">past</span>`) : ''}</div></div>`;
}

function projStats(p) {
  const tasks = D.tasks.filter(t => t.Project === p.Project), items = D.items.filter(i => i.Project === p.Project);
  const log = D.projectlog.filter(l => l.Project === p.Project);
  const spent = sum(items.filter(i => yes(i.Bought)), i => i.Price) + sum(log, l => l.Cost);
  return { tasks, items, log, done: tasks.filter(t => t.Status === 'done').length, spent,
           hours: sum(log, l => l.Hours), km: sum(log.filter(l => l.Type === 'Trip'), l => l.Km), trips: log.filter(l => l.Type === 'Trip').length };

// ---------- SRL (private) ----------
function viewSrl() {
  const year = todayISO().slice(0, 4);
  const inv = D.invoices.filter(i => String(i.Date).startsWith(year));
  const revenue = sum(inv, i => i.Amount), paid = sum(inv.filter(i => i.PaidOn), i => i.Amount);
  const pct = +D.settings.SrlTaxPotPct || 0;
  const unpaid = D.invoices.filter(i => !i.PaidOn);
  const srlDates = D.dates.filter(d => d.Private === 'yes');
  const open = srlDates.filter(d => d.Due && !isDone(d)).sort((a, b) => a.Due < b.Due ? -1 : 1);
  const qs = [1, 2, 3, 4].map(q => sum(inv.filter(i => Math.ceil(+String(i.Date).slice(5, 7) / 3) === q), i => i.Amount));
  const qmax = Math.max(1, ...qs);
  return `
    <div class="tiles"><div class="tile"><b>${lei(revenue)}</b><span>revenue ${year}</span></div>
      <div class="tile"><b>${lei(revenue * pct / 100)}</b><span>tax pot (${pct}%)</span></div>
      <div class="tile"><b>${lei(revenue - paid)}</b><span>unpaid</span></div></div>
    <h2>Revenue by quarter, ${year}</h2>
    <div class="card"><div class="cols">${qs.map((v, i) => `<div><b style="height:${v / qmax * 90}px;background:var(--accent)"></b>Q${i + 1}<br>${v ? Math.round(v / 1000) + 'k' : ''}</div>`).join('')}</div></div>
    ${srlHistory()}
    <h2>Deadlines</h2>
    ${open.map(dateRow).join('') || '<p class="muted">No open SRL deadlines.</p>'}
    ${srlDates.filter(d => !d.Due).map(dateRow).join('')}
    <button class="alert soft" onclick="dividendDate()">💸 Paying dividends? Tap to add the tax deadline</button>
    <h2>Invoices</h2>
    <button class="btn wide" onclick="invoiceModal()">+ Log an invoice (after issuing it in e-Factura)</button>
    ${unpaid.length ? `<p class="small" style="color:var(--warn)"><b>${unpaid.length} unpaid</b></p>` : ''}
    ${D.invoices.slice().sort((a, b) => a.Date < b.Date ? 1 : -1).map(i => `<div class="row">
      <span class="emo">${i.PaidOn ? '✅' : '⏳'}</span><div class="grow"><div>${esc(i.Number)}, ${esc(i.Client)}</div>
      <div class="muted small">${fmt(i.Date)}${i.PaidOn ? ', paid ' + fmt(i.PaidOn) : ''}</div></div><b>${lei(i.Amount)}</b>
      ${i.PaidOn ? '' : `<button class="done" onclick="upd('Invoices',${i._row},{PaidOn:'${todayISO()}'},'Marked paid ✓')">✓</button>`}</div>`).join('')}`;
}
const COST_TYPES = ['Salaries & taxes', 'Training logistics', 'Accounting', 'Taxes', 'Bank fees', 'Fuel', 'Marketing', 'Equipment',
                    'Website', 'Phone', 'Admin', 'Casual', 'Other'];
const k = v => v >= 1000 ? Math.round(v / 1000) + 'k' : Math.round(v);
function srlHistory() {
  const months = (D.srlmonths || []).slice().sort((a, b) => a.Month < b.Month ? -1 : 1);
  const costs = D.srlcosts || [];
  const actual = months.filter(m => m.Plan !== 'yes' && m.Balance !== '');
  const years = [...new Set(D.invoices.map(i => String(i.Date).slice(0, 4)).concat(costs.map(c => String(c.Date).slice(0, 4))))].filter(Boolean).sort();
  const rev = years.map(y => sum(D.invoices.filter(i => String(i.Date).startsWith(y)), i => i.Amount));
  const cst = years.map(y => sum(costs.filter(c => String(c.Date).startsWith(y)), c => c.Amount));
  const ymax = Math.max(1, ...rev, ...cst);
  const last = actual.slice(-24), bmax = Math.max(1, ...last.map(m => +m.Balance || 0));
  const cy = SEG.srlYear || 'all', types = {};
  costs.filter(c => cy === 'all' || String(c.Date).startsWith(cy)).forEach(c => types[c.Type || 'Other'] = (types[c.Type || 'Other'] || 0) + (+c.Amount || 0));
  const tl = Object.entries(types).sort((a, b) => b[1] - a[1]), tmax = tl.length ? tl[0][1] : 1, ttot = sum(tl, t => t[1]);
  const plan = months.filter(m => m.Plan === 'yes');
  const notes = months.filter(m => m.Notes && m.Plan !== 'yes');
  return `
    <h2>Revenue vs costs per year</h2>
    <div class="card"><div class="cols" style="height:140px">${years.map((y, i) => `<div><div style="display:flex;gap:2px;align-items:flex-end;height:100px">
      <b style="flex:1;height:${rev[i] / ymax * 100}px;background:var(--good)"></b><b style="flex:1;height:${cst[i] / ymax * 100}px;background:var(--bad)"></b></div>
      ${y}<br>${k(rev[i] - cst[i])}</div>`).join('')}</div>
      <div class="small muted">🟩 revenue, 🟥 costs, number = result</div></div>
    ${last.length ? `<h2>Bank balance, last ${last.length} months</h2>
    <div class="card"><div class="cols dense">${last.map((m, i) => `<div><b style="height:${(+m.Balance || 0) / bmax * 90}px;background:var(--accent)"></b>${(last.length - 1 - i) % 3 === 0 ? m.Month.slice(5) : '&nbsp;'}</div>`).join('')}</div>
      <div class="small muted">Latest recorded: <b>${lei(last[last.length - 1].Balance)}</b> (${monthName(last[last.length - 1].Month, { month: 'long', year: 'numeric' })})</div></div>` : ''}
    <h2>Costs by type</h2>
    <div class="chips">${['all'].concat(years).map(y => `<button class="chip ${y === cy ? 'on' : ''}" onclick="SEG.srlYear='${y}';render()">${y === 'all' ? 'All years' : y}</button>`).join('')}</div>
    <div class="card">${tl.map((t, i) => `<div class="barrow"><div class="top"><span>${esc(t[0])}</span><span><b>${lei(t[1])}</b> <span class="muted">${Math.round(t[1] / ttot * 100)}%</span></span></div>
      ${bar(t[1] / tmax * 100, GROUP_COLORS[i % GROUP_COLORS.length])}</div>`).join('') || '<p class="muted">No costs logged.</p>'}
      <button class="btn ghost wide" onclick="srlCostModal()">+ Log an SRL cost</button></div>
    ${plan.length ? `<h2>${plan[0].Month.slice(0, 4)}: plan vs actual</h2>
    <div class="card">${plan.map(m => {
      const ar = sum(D.invoices.filter(i => String(i.Date).startsWith(m.Month)), i => i.Amount), ac = sum(costs.filter(c => String(c.Date).startsWith(m.Month)), c => c.Amount);
      return `<div class="barrow"><div class="top"><b>${monthName(m.Month, { month: 'long' })}</b>
        <span class="small">in ${k(ar)} / plan ${k(+m.Revenue || 0)}, out ${k(ac)} / plan ${k(+m.Costs || 0)}</span></div>
        ${bar(+m.Costs ? ac / m.Costs * 100 : 0, ac > +m.Costs ? 'var(--bad)' : 'var(--good)')}</div>`;
    }).join('')}<p class="muted small">Fill in the real ${plan[0].Month.slice(0, 4)} numbers: log invoices and costs above. The plan stays for comparison.</p></div>` : ''}
    ${notes.length ? `<h2>Your insights</h2>${notes.map(m => `<div class="card small">💡 ${esc(m.Notes)}</div>`).join('')}` : ''}`;
}

const MONTHS_EN = ['january', 'february', 'march', 'april', 'may', 'june', 'july', 'august', 'september', 'october', 'november', 'december'];
const MONTHS_RO = ['ianuarie', 'februarie', 'martie', 'aprilie', 'mai', 'iunie', 'iulie', 'august', 'septembrie', 'octombrie', 'noiembrie', 'decembrie'];
function askPeriod(q) {
  const y = +todayISO().slice(0, 4), m = todayISO().slice(0, 7);
  const iso = (yy, mm) => yy + '-' + String(mm).padStart(2, '0');
  let n;
  if (/this month|luna asta|luna aceasta/.test(q)) return { from: m + '-01', to: m + '-31', label: 'this month' };
  if (/last month|luna trecuta/.test(q)) { const p = prevMonth(m); return { from: p + '-01', to: p + '-31', label: monthName(p, { month: 'long' }) }; }
  if ((n = q.match(/last (\d+) months|ultimele (\d+) luni/))) { const k = +(n[1] || n[2]); let s = m; for (let i = 1; i < k; i++) s = prevMonth(s); return { from: s + '-01', to: m + '-31', label: `the last ${k} months` }; }
  if (/last year|anul trecut/.test(q)) return { from: (y - 1) + '-01-01', to: (y - 1) + '-12-31', label: String(y - 1) };
  if (/all time|ever|total|dintotdeauna/.test(q)) return { from: '1900-01-01', to: '2999-12-31', label: 'all time' };
  const yr = (q.match(/\b(20\d\d)\b/) || [])[1];
  const hasWord = x => new RegExp('\\b' + x + '\\b').test(q);
  const mi = MONTHS_EN.findIndex(hasWord) >= 0 ? MONTHS_EN.findIndex(hasWord) : MONTHS_RO.findIndex(hasWord);
  if (mi >= 0) { const yy = yr || (mi + 1 > +m.slice(5) ? y - 1 : y); const k = iso(yy, mi + 1); return { from: k + '-01', to: k + '-31', label: monthName(k, { month: 'long', year: 'numeric' }) }; }
  if (yr) return { from: yr + '-01-01', to: yr + '-12-31', label: yr };
  return { from: y + '-01-01', to: y + '-12-31', label: 'this year (' + y + ')' };
}
function ask(qRaw) {
  const q = plain(qRaw);
  const p = askPeriod(q);
  const topics = TOPICS.filter(t => t.words.some(w => new RegExp('\\b' + w + '\\b').test(q)));
  const catsDirect = D.categories.filter(c => q.includes(plain(c.Category))).map(c => c.Category);
  const inPeriod = D.transactions.filter(t => ron(t) && t.Date >= p.from && t.Date <= p.to);
  let match, label, income = topics.some(t => t.income);
  if (topics.length || catsDirect.length) {
    // 'Personal:*' means every category whose name starts with "Personal:"
    const cats = new Set(catsDirect.concat(...topics.map(t => t.cats)).flatMap(c => c.endsWith('*') ? D.categories.map(x => x.Category).filter(x => x.startsWith(c.slice(0, -1))) : [c]));
    const res = topics.map(t => t.merchant).filter(Boolean);
    match = t => cats.has(t.Category) || res.some(r => r.test(plain(t.Merchant)));
    label = topics.map(t => t.label).concat(catsDirect.map(c => c.toLowerCase()))
      .filter((x, i, a) => a.findIndex(y => plain(y) === plain(x)) === i && !topics.some(t => t.cats.length === 1 && plain(t.cats[0]) === plain(x) && t.label !== x)).join(' and ');
  } else {
    // nothing recognised: look for the words in merchant names, e.g. "lidl" or "emag"
    const STOP = /^(how|much|did|we|i|my|our|on|for|in|the|this|last|year|month|spend|spent|pay|paid|cat|cost|what|was|were|de|cat|am|pe|la|in|anul|luna|platit|cheltuit|total)$/;
    const words = q.split(/[^a-z0-9.&]+/).filter(w => w.length >= 3 && !STOP.test(w) && !/^20\d\d$/.test(w) && !MONTHS_EN.includes(w) && !MONTHS_RO.includes(w));
    if (!words.length) return null;
    match = t => words.some(w => plain(t.Merchant).includes(w));
    label = '"' + words.join(' ') + '"';
  }
  const rows = inPeriod.filter(t => match(t) && (income ? +t.Amount > 0 : +t.Amount < 0 && catOf(t.Category).Type !== 'ignore'))
    .sort((a, b) => a.Date < b.Date ? 1 : -1);
  const total = Math.abs(sum(rows, t => t.Amount));
  const byCat = {}, byMonth = {}, byMerchant = {};
  rows.forEach(t => { const v = Math.abs(t.Amount); byCat[t.Category] = (byCat[t.Category] || 0) + v; byMonth[t.Date.slice(0, 7)] = (byMonth[t.Date.slice(0, 7)] || 0) + v;
    const mk = String(t.Merchant || '').split(/[,;:]/)[0].slice(0, 30); byMerchant[mk] = (byMerchant[mk] || 0) + v; });
  return { q: qRaw, p, label, total, rows, income, byCat, byMonth, byMerchant };
}

// ---------- INSIGHTS: what your numbers say, with 2-3 concrete things to try ----------
function lastMonths(k) { const out = []; let m = prevMonth(monthKey(0)); for (let i = 0; i < k; i++) { out.unshift(m); m = prevMonth(m); } return out; }
function insights() {
  const full12 = lastMonths(12), from = full12[0] + '-01', to = full12[11] + '-31';
  const tx = D.transactions.filter(t => ron(t) && t.Date >= from && t.Date <= to);
  const spendOf = f => -sum(tx.filter(t => spendTx(t) && f(t)), t => t.Amount);
  const totalSpend = spendOf(() => true);
  const incomeRows = tx.filter(t => t.Category === 'Income' && t.Account !== 'Up card');
  const income = sum(incomeRows, t => t.Amount);
  const out = [];
  if (!tx.length) return out;
  // 1. travel paid for by extra income
  const travel = spendOf(t => t.Category === 'Travel');
  const byMonthInc = full12.map(m => sum(incomeRows.filter(t => t.Date.startsWith(m)), t => t.Amount)).sort((a, b) => a - b);
  const typical = byMonthInc[Math.floor(byMonthInc.length / 2)] || 0, extra = Math.max(0, income - typical * 12);
  if (travel > totalSpend * .2) out.push({ score: 90, emoji: '✈️', title: `Travel is ${Math.round(travel / totalSpend * 100)}% of your spending`,
    body: `${lei(travel)} on travel in the last 12 months.${extra > 0 ? ` Your income above a normal month (dividends, bonuses) was about ${lei(extra)}, so trips are mostly paid by extras, not by your salary.` : ''}`,
    tips: ['Give travel its own pot: move every dividend or bonus straight into a "Travel fund" goal and book trips only from that pot.',
           `Set a trip budget before booking (each trip has a budget field). A plan made in advance beats deciding at the airport.`,
           'Book the next trip only when the pot covers it. Waiting a little is the cheapest discount.'], ask: 'travel last 12 months' });
  // 2. fastest-growing category (last 3 months vs the 3 before)
  const a6 = lastMonths(6), recent = a6.slice(3), before = a6.slice(0, 3);
  const catTotal = (ms, c) => -sum(D.transactions.filter(t => spendTx(t) && t.Category === c && ms.some(m => t.Date.startsWith(m))), t => t.Amount);
  const grow = D.categories.filter(c => ['flex', 'fixed'].includes(c.Type) && !(c.Category === 'Travel' && out.length)).map(c => ({ c: c.Category, r: catTotal(recent, c.Category), b: catTotal(before, c.Category) }))
    .filter(x => x.r - x.b > 300 && x.b > 0).sort((x, y) => (y.r - y.b) - (x.r - x.b))[0];
  if (grow) out.push({ score: 70, emoji: '📈', title: `${grow.c} is growing`,
    body: `${lei(grow.r)} in the last 3 months, up from ${lei(grow.b)} in the 3 months before (+${Math.round((grow.r - grow.b) / grow.b * 100)}%).`,
    tips: [`Tap "See the numbers" and look for the 2 or 3 biggest items. Growth usually comes from a few, not from everything.`,
           `If it is planned (a treatment, a renovation), fine: just give it a monthly guide so it stays visible.`,
           `Set a monthly guide for ${grow.c} in Customise. Seeing the number is often enough to bend the curve.`], ask: grow.c.toLowerCase() + ' last 6 months' });
  // 3. small daily habits, yearly
  const coffee = spendOf(t => t.Category === 'Coffee'), out2 = spendOf(t => t.Category === 'Eating out');
  const cups = tx.filter(t => t.Category === 'Coffee' && +t.Amount < 0).length, cup = cups ? coffee / cups : 0;
  if (coffee + out2 > 1500) out.push({ score: 55, emoji: '☕', title: `Coffee and eating out: ${lei(coffee + out2)} a year`,
    body: `Coffee ${lei(coffee)} and eating out ${lei(out2)} in 12 months, about ${lei((coffee + out2) / 52)} a week. Small amounts add up quietly.`,
    tips: [`Keep the ones you love. Your average coffee is ${lei(cup)}; swapping one routine coffee a week for one from home is about ${lei(cup * 52)} a year.`,
           'Plan 2 eating-out evenings a week together on Sunday, so the rest are a choice, not a default.',
           'Move what you save into a goal you care about (the travel fund), so it does not just disappear into other spending.'], ask: 'coffee last 12 months' });
  // 4. subscriptions
  const subs = spendOf(t => t.Category === 'Subscriptions');
  if (subs > 0) out.push({ score: 40, emoji: '📺', title: `Subscriptions: ${lei(subs)} a year`,
    body: `About ${lei(subs / 12)} a month on recurring services.`,
    tips: ['Once a year (January) cancel anything you did not use last month. It takes 10 minutes.',
           'Share family plans with your partner instead of paying twice.',
           'Add each subscription as a date with its cost, so the renewal reminds you before it charges.'], ask: 'subscriptions last 12 months' });
  // 5. share of income kept
  const saved = -sum(tx.filter(t => t.Category === 'Savings'), t => t.Amount);
  if (income > 0) {
    const rate = Math.round((income - totalSpend) / income * 100);
    out.push({ score: rate < 10 ? 85 : 35, emoji: rate < 10 ? '🌧️' : '🌱', title: `You kept ${rate}% of what came in`,
      body: `Income ${lei(income)} and spending ${lei(totalSpend)} in the last 12 months${saved > 0 ? `; ${lei(saved)} of what you kept went to savings` : ''}.`,
      tips: rate < 10 ? ['Automate first: a standing transfer on payday, even 500 lei, beats saving whatever is left at the end of the month.',
                         'Start with the smallest amount you would not miss, then raise it every January.',
                         'Treat bonuses and dividends as savings by default and spend from them only on purpose.']
                      : ['Keep the automatic transfer and raise it a little each January ("save more tomorrow").',
                         'Name each savings pot for what it is for; money with a label is spent less easily.',
                         'Check once a year that savings beyond your 3-month buffer are working for you (interest, bonds).'], ask: 'income last 12 months' });
  }
  // 6. emergency buffer in months of everyday costs (cash + savings balances + the emergency goal)
  const essentials = spendOf(t => !['Travel', 'Campervan project', 'Savings'].includes(t.Category)) / 12;
  const goalBuf = sum(D.goals.filter(g => /emergency|buffer|urgenta/i.test(g.Goal)), g => g.Saved);
  const ready = sum((D.balances || []).filter(b => b.Kind === 'cash' || b.Kind === 'savings'), inLei) + goalBuf;
  if (essentials > 0) { const months = ready / essentials;
    out.push({ score: months < 1 ? 80 : months < 3 ? 60 : 20, emoji: '🛟', title: `Your safety cushion covers ${months.toFixed(1)} months`,
      body: `Everyday costs (without travel and the campervan) are about ${lei(essentials)} a month. Cash, savings and your emergency goal add up to ${lei(ready)}.`
        + ((D.balances || []).every(b => !+b.Amount) ? ' Add your cash and savings in Money → "Your money right now" to make this exact.' : ''),
      tips: months < 3 ? [`Aim for 3 months (${lei(essentials * 3)}). A savings cushion is the strongest sign of financial wellbeing in the CFPB research.`,
                          'Keep it in a separate account or vault, so it is not counted as spending money.',
                          'Refill it first after an emergency, before other goals.']
                       : ['You are at a healthy level. Keep it separate from spending money.', 'Above 6 months, consider putting the extra to work (bonds, deposits).'], ask: '' }); }
  // 7. big costs coming
  const soon = D.dates.filter(d => d.Due && !isDone(d) && days(d.Due) >= 0 && days(d.Due) <= 90 && +d.Cost > 0);
  if (soon.length) out.push({ score: 75, emoji: '📅', title: `${lei(sum(soon, d => d.Cost))} of bills in the next 3 months`,
    body: soon.map(d => `${d.Title} (${fmt(d.Due)}, ${lei(d.Cost)})`).join(', ') + '.',
    tips: ['Put this amount aside now, so these do not eat into a normal month.',
           'For insurance (RCA, home), ask for 3 offers 30 days before; prices for the same car differ a lot.',
           'Add a cost to every date that has one, so the yearly-bills pot stays accurate.'], ask: '' });
  // 8. over guide this month
  const now = catSpend(monthKey(0)), over = D.categories.filter(c => +c.MonthlyTarget > 0 && (now[c.Category] || 0) > c.MonthlyTarget);
  if (over.length) out.push({ score: 65, emoji: '🚧', title: `Over your guide in ${over.map(c => c.Category).join(', ')}`,
    body: over.map(c => `${c.Category}: ${lei(now[c.Category])} of ${lei(c.MonthlyTarget)}`).join('; ') + '.',
    tips: ['No guilt: just notice it. Guides are for awareness, not punishment.',
           'Pick one specific moment to choose differently next week: "When I…, I will…".',
           'If the guide is simply too low for real life, raise it. A realistic guide works better than a strict one.'], ask: '' });
  // 9. biggest payments lately
  const big = D.transactions.filter(t => spendTx(t) && lastMonths(3).some(m => t.Date.startsWith(m))).sort((x, y) => x.Amount - y.Amount).slice(0, 3);
  if (big.length) out.push({ score: 30, emoji: '🔍', title: 'Your 3 biggest payments in the last 3 months',
    body: big.map(t => `${esc(t.Merchant)} ${lei(-t.Amount)} (${fmt(t.Date)})`).join(', ') + '.',
    tips: ['Big one-offs shape a month more than daily habits. Were these planned?',
           'For anything over 500 lei that is not urgent, wait 48 hours before buying.'], ask: '' });
  // 10. balances not updated
  const stale = (D.balances || []).filter(b => !b.Updated || -days(b.Updated) > 45);
  if (D.balances && D.balances.length && stale.length) out.push({ score: 45, emoji: '🧮', title: 'Update your cash and savings',
    body: `${stale.length} of your balances ${stale.length === 1 ? 'has' : 'have'} not been updated for over 6 weeks, so the cushion insight may be off.`,
    tips: ['Do it during your Sunday check-in, once a month: count the cash, look at the savings apps, type the numbers.',
           'Add a monthly date "Update cash & savings" in Dates, so SelfMate reminds you.'], ask: '' });
  return out.sort((x, y) => y.score - x.score);
}
function insightCard(i) {
  return `<div class="card"><div class="serif" style="font-size:19px;line-height:1.25">${i.emoji} ${esc(i.title)}</div>
    <p style="margin:6px 0">${i.body}</p>
    <div class="alert soft" style="margin:8px 0 0;cursor:default"><b>Try this</b><ul style="margin:6px 0 0;padding-left:18px">${i.tips.map(t => `<li style="margin:4px 0">${esc(t)}</li>`).join('')}</ul></div>
    ${i.ask ? `<button class="back" onclick="askModal('${esc(i.ask)}')">See the numbers</button>` : ''}</div>`;
}

}
