let WIMG = '';   // picture found on the shop page for the item being edited

async function fillFromLink() {
  const url = val('wl'), btn = $('#wfill');
  if (!url) return toast('Paste a link first');
  if (btn) { btn.disabled = true; btn.textContent = 'Reading…'; }
  const r = await call('peek', { url }).catch(() => null);
  if (btn) { btn.disabled = false; btn.textContent = 'Fill in'; }
  if (!r || !$('#wi')) return;
  if (r.title && (!val('wi') || val('wi').length < 4 || /https?:/.test(val('wi')))) $('#wi').value = r.title;
  if (r.shop && !val('ws')) $('#ws').value = r.shop;
  if (r.price) {
    const rate = rateOf(r.currency || 'RON');
    $('#wp').value = rate ? Math.round(r.price * rate) : r.price;
    $('#wcur').textContent = r.currency && r.currency !== 'RON' ? (rate ? `Converted from ${r.price} ${r.currency}.` : `The shop says ${r.price} ${r.currency}: add a rate in ⚙️ Customise, or type the lei.`) : '';
    if ($('#ww')) $('#ww').value = wishWait(+$('#wp').value);
  }
  if (r.image) { WIMG = r.image; $('#wpv').innerHTML = `<img class="wbig" src="${esc(r.image)}" alt="" referrerpolicy="no-referrer">`; }
  toast(r.title || r.price ? 'Filled in from the page ✓' : 'The shop did not say. Type the name and price.');
}
function saveWish(row) {
  const v = { Item: val('wi'), Price: +val('wp') || '', Link: val('wl'), Shop: val('ws'), Notes: val('wn'), Image: WIMG };
  if (!v.Item) return toast('What is it?');
  if ($('#ww')) v.WaitUntil = plusDays(Math.max(0, Math.round(+val('ww') || 0)));
  if (!row) return add('Wishlist', Object.assign(v, { Added: todayISO(), Status: 'waiting' }), 'Added. Let it wait 🌱');
  const old = wishes().find(x => x._row === row), st = val('wst');
  v.Status = st;
  if (st !== 'waiting' && (old.Status || 'waiting') === 'waiting') v.Decided = todayISO();
  if (st === 'waiting') v.Decided = '';
  upd('Wishlist', row, v, 'Saved ✓');
}
function waitMore(row) { const w = wishes().find(x => x._row === row); upd('Wishlist', row, { WaitUntil: plusDays(wishWait(w.Price)) }, 'Waiting a bit longer ⏳'); }
function decideWish(row, status) {
  const w = wishes().find(x => x._row === row);
  act('updateRow', { tab: 'Wishlist', row, values: { Status: status, Decided: todayISO() } }, status === 'bought' ? 'Enjoy it ✓' : 'Let go 🍃');   // shows at once
  if (status === 'dropped' && +w.Price && D.goals.length) openModal(`<h3>🍃 You kept ${lei(w.Price)}</h3>
    <p class="muted">Money you don't spend is easy to spend on something else. Moving it to a goal makes it count.</p>
    <p class="small">Did you move it to one of these?</p>
    <div class="chips">${D.goals.map(g => `<button class="chip" onclick="addToGoal(${g._row},${+w.Price})">${esc(g.Emoji)} ${esc(g.Goal)}</button>`).join('')}</div>
    <div class="btns"><button class="btn ghost" onclick="closeModal()">Not now</button></div>`);
}
function addToGoal(row, amount) {
  const g = D.goals.find(x => x._row === row);

function lineChart(series, from, to, lo, hi, opt) {

  const x = iso => L + (days(iso) - days(from)) / span * (W - L - R), y = v => T + (1 - (v - lo) / (hi - lo || 1)) * (H - T - B);

  (opt.grid || []).forEach(v => { g += `<line x1="${L}" x2="${W - R}" y1="${y(v)}" y2="${y(v)}" class="gl"/>` + (opt.left ? `<text x="${L - 4}" y="${y(v) + 4}" text-anchor="end" class="gt">${v}</text>` : ''); });
  const ticks = opt.ticks || [from, to];
  ticks.forEach(t => { g += `<text x="${Math.min(W - R - 14, Math.max(L + 14, x(t)))}" y="${H - 3}" text-anchor="middle" class="gt">${new Date(t + 'T00:00:00').toLocaleDateString('en-GB', { day: 'numeric', month: 'short' })}</text>`; });
  series.forEach(s => {
    const pts = s.pts.filter(p => p[1] !== '' && p[1] != null && !isNaN(p[1])).sort((a, b) => a[0] < b[0] ? -1 : 1);

    pts.forEach(p => { if (prev && days(p[0]) - days(prev) > (opt.gap || 3)) flush(); seg.push(x(p[0]).toFixed(1) + ',' + y(p[1]).toFixed(1)); prev = p[0]; });
    flush();
    pts.forEach(p => { g += `<circle cx="${x(p[0]).toFixed(1)}" cy="${y(p[1]).toFixed(1)}" r="${pts.length > 40 ? 1.8 : 3}" fill="${s.color}"/>`; });

}

function measureCard(kind) {
  const rows = (D.measures || []).filter(x => x.Kind === kind).sort((a, b) => a.Date < b.Date ? -1 : 1);
  if (!rows.length) return '';
  const last = rows[rows.length - 1], unit = esc(last.Unit || ''), two = rows.some(r => r.Value2 !== '' && r.Value2 != null);
  const vals = rows.flatMap(r => [+r.Value, two && r.Value2 !== '' ? +r.Value2 : null]).filter(v => v !== null && !isNaN(v));
  const lo = Math.min(...vals), hi = Math.max(...vals), pad = Math.max(1, (hi - lo) * 0.15);
  const from = rows[0].Date < isoBack(365) ? isoBack(365) : rows[0].Date, to = todayISO();
  const shown = rows.filter(r => r.Date >= from);
  const chart = shown.length > 1 ? lineChart([{ color: 'var(--leaf)', pts: shown.map(r => [r.Date, +r.Value]) }].concat(two ? [{ color: 'var(--berry)', pts: shown.map(r => [r.Date, r.Value2 === '' ? null : +r.Value2]) }] : []),
    from, to, Math.floor(lo - pad), Math.ceil(hi + pad), { left: 30, grid: [Math.round(lo), Math.round(hi)], gap: 3650, label: kind + ' over time' }) : '';
  return `<div class="card"><div class="label">Latest, ${fmt(last.Date)}</div><div class="big">${esc(last.Value)}${two && last.Value2 !== '' ? '/' + esc(last.Value2) : ''} <span class="small muted">${unit}</span></div>

    if (action === 'login') { if (d.pin !== '1234') { toast('⚠️ Wrong PIN (preview PIN is 1234)'); throw new Error('wrong'); } unlocked = true; return 'preview'; }
    if (action === 'logout') { unlocked = false; return true; }
    if (action === 'getData') return Object.assign(JSON.parse(JSON.stringify(window.TEST_DB || db)), { sessionUntil: Date.now() + 864e5 });
    // like savePhotos_ on the server: keep the entry's photos minus _remove, add _photos up to 5
    const pics = (v, old) => { const keep = picsOf(old || {}).filter(x => !(v._remove || []).includes(x.id));
      (v._photos || []).slice(0, Math.max(0, 5 - keep.length)).forEach(x => { const id = 'p' + (++MOCK_N); MOCK_PH[id] = x.photo; MOCK_PH[id + 't'] = x.thumb; keep.push({ id, thumb: id + 't' }); });
      delete v._photos; delete v._remove; v.Photo = keep.map(x => x.id).join(','); v.Thumb = keep.map(x => x.thumb).join(','); };
    if (action === 'addRow') { const k = tabKey(d.tab), v = Object.assign({ _row: row++, Owner: 'owner' }, d.values);
      if (v._photos) pics(v);
      (db[k] = db[k] || []).push(v); return v._row; }
    if (action === 'photos') { const o = {}; d.ids.forEach(id => o[id] = MOCK_PH[id] || ''); return o; }
    if (action === 'updateRow') { const r = db[tabKey(d.tab)].find(x => x._row === d.row), v = Object.assign({}, d.values);
      if (v._photos || v._remove) pics(v, r);
      Object.assign(r, v); }
    if (action === 'markDone') { const r = db.dates.find(x => x._row === d.row); r.LastDone = t;
      if (+r.RepeatMonths) { const n = new Date(r.Due + 'T00:00:00'); n.setMonth(n.getMonth() + +r.RepeatMonths); r.Due = n.toISOString().slice(0, 10); } }
    if (action === 'answer') db.transactions.forEach(x => { if (x._row === d.row) x.Category = d.category; });
    if (action === 'setSetting') db.settings[d.key] = d.value;
    if (action === 'deleteRow') { const k = tabKey(d.tab); db[k] = db[k].filter(r => r._row !== d.row); }
    if (action === 'renameCategory') { db.categories.forEach(c => { if (c.Category === d.from) c.Category = d.to; }); db.transactions.forEach(t => { if (t.Category === d.from) t.Category = d.to; }); }
    if (action === 'checkin') { const h = db.habit; if (!(h.last >= mondayISO())) h.n++; h.last = t; if (d.plan !== undefined) h.plan = d.plan; return Object.assign({}, h); }
    if (action === 'import') return { added: 0, skipped: 0, unsorted: 0 };
    if (action === 'peek') return { url: d.url, title: 'Waterproof hiking jacket, men', price: 79.9, currency: 'EUR', shop: 'Example Shop', image: '' };
    if (action === 'pushTest') return { sent: 0, devices: 0 };
    if (action === 'rate') { const v = Object.assign({ Owner: 'owner' }, d.values), r = db.mood.find(x => x.Date === v.Date);
      if (r) { Object.assign(r, v); return r._row; } v._row = row++; db.mood.push(v); return v._row; }
    if (action === 'tagTrip') db.transactions.forEach(x => { if ((d.add || []).includes(x._row)) x.Trip = d.trip; if ((d.remove || []).includes(x._row) && x.Trip === d.trip) x.Trip = ''; });
    return true;
  } };
})();

load();
</script>
